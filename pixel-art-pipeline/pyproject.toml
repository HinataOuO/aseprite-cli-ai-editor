[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-art-pipeline"
version = "0.1.0"
description = "Deterministic local PNG to pixel matrix pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
